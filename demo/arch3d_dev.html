<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch3D dev</title>
<meta name="description" content="Development harness for the LISA architecture 3D scene (demo/arch3d.js).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0A0C10; --panel: #11141A; --line: #1F2430; --ink: #E7EBF2; --dim: #7D8798;
    --cold: #6FA3FF; --warm: #FFB347; --truth: #F2F4F7; --good: #58D68D; --bad: #FF6B6B;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    font-family: var(--mono); font-size: 12px; color: var(--dim);
  }
  header b { color: var(--ink); font-weight: 500; }
  #stage { position: relative; flex: 1 1 auto; min-height: 240px; }
  footer {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-top: 1px solid var(--line); background: var(--panel);
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  button, select {
    font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 10px; cursor: pointer; min-width: 68px;
  }
  button:hover, select:hover { border-color: var(--dim); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid var(--cold); outline-offset: 2px; }
  input[type=range] { flex: 1 1 auto; accent-color: var(--cold); min-width: 120px; }
  .ro { color: var(--dim); min-width: 8ch; }
  .ro b { color: var(--ink); font-weight: 500; }
  .stg { color: var(--dim); min-width: 22ch; }
  .rm { color: var(--warm); display: none; }
  @media (prefers-reduced-motion: reduce) { .rm { display: inline; } }
  @media (max-width: 640px) {
    header { font-size: 11px; gap: 10px; }
    footer { flex-wrap: wrap; padding: 8px 16px; }
    .stg { min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <b>arch3d.js</b>
  <span>drag to orbit · wheel to zoom · double-click to reset</span>
  <span class="rm">reduced motion: idle drift and jitter off</span>
</header>
<div id="stage"></div>
<footer>
  <button id="play" type="button" aria-label="play or pause">play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="timeline">
  <span class="ro">t <b id="tv">0.000</b></span>
  <span class="stg" id="stg"></span>
  <select id="arm" aria-label="arm">
    <option value="LISAS">LISAS</option>
    <option value="LISASD">LISASD</option>
  </select>
  <label class="ro" for="inf">p</label>
  <input id="inf" type="range" min="0" max="1000" value="1000" step="1" aria-label="inference progress" style="max-width:140px">
</footer>

<script type="module">
// The Next app does exactly this: bundled three (r186) on window.THREE, then arch3d.js as a
// classic script. The pinned r186 ESM build, or a local copy at ./vendor/ when offline.
const SOURCES = ['https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js', './vendor/three.module.js'];
let THREE = null, err = null;
for (const src of SOURCES) {
  try { THREE = await import(src); break; } catch (e) { err = e; }
}
if (!THREE) { document.getElementById('stage').textContent = 'three.js failed to load: ' + err; throw err; }
window.THREE = THREE;
await new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = 'arch3d.js'; s.onload = res; s.onerror = () => rej(new Error('arch3d.js failed to load'));
  document.head.appendChild(s);
});
boot();
function boot() {
  var cs = getComputedStyle(document.documentElement);
  var tokens = {};
  ['ground', 'panel', 'line', 'ink', 'dim', 'cold', 'warm', 'truth', 'good', 'bad'].forEach(function (k) {
    tokens[k] = cs.getPropertyValue('--' + k).trim();
  });
  var STAGE_NAMES = ['decimate 48 → 12 kHz', 'conv stack', 'latents', 'decoder', 'output 48 kHz'];
  var playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'),
      tv = document.getElementById('tv'), stg = document.getElementById('stg'),
      armSel = document.getElementById('arm'), inf = document.getElementById('inf');
  var scrubbing = false;

  var h = window.Arch3D.mount(document.getElementById('stage'), {
    arm: 'lisas_tau1', cls: armSel.value, tokens: tokens,
    onTime: function (t) {
      if (!scrubbing) scrub.value = Math.round(t * 1000);
      tv.textContent = t.toFixed(3);
      stg.textContent = STAGE_NAMES[h.stageOf(t)];
    }
  });
  window.arch = h;   // for poking at it from the console

  function setPlaying(on) {
    if (on) h.play(); else h.pause();
    playBtn.textContent = on ? 'pause' : 'play';
  }
  playBtn.addEventListener('click', function () { setPlaying(!h.isPlaying()); });
  scrub.addEventListener('pointerdown', function () { scrubbing = true; });
  scrub.addEventListener('input', function () { h.seek(scrub.value / 1000); });
  scrub.addEventListener('change', function () { scrubbing = false; });
  scrub.addEventListener('pointerup', function () { scrubbing = false; });
  armSel.addEventListener('change', function () { h.setArm(armSel.value.toLowerCase() + '_tau1', armSel.value); });
  inf.addEventListener('input', function () { h.setInference(inf.value / 1000); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!h.isPlaying()); }
  });

  h.seek(0);
  if (!h.reducedMotion()) setPlaying(true);
  else stg.textContent = STAGE_NAMES[0];
  window.__mountDev = function (el, cls) {
    return window.Arch3D.mount(el, { arm: cls.toLowerCase() + '_tau1', cls: cls, tokens: tokens });
  };
  window.__ready = true;
}
</script>
</body>
</html>
